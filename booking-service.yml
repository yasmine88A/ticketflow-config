server:
  port: 8083

spring:
  datasource:
    url: jdbc:h2:mem:bookingdb
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
  cloud:
    openfeign:
      client:
        config:
          event-service:
            connectTimeout: 2000
            readTimeout: 3000

management:
  endpoints:
    web:
      exposure:
        include: health,info